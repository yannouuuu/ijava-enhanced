name: Build iJava Installer

on:
  push:
    branches:
      - main
      - charm
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-amd64
            output: ijava-installer-linux-amd64
          
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            platform: linux-arm64
            output: ijava-installer-linux-arm64
          
          # macOS
          - os: macos-latest
            goos: darwin
            goarch: amd64
            platform: darwin-amd64
            output: ijava-installer-darwin-amd64
          
          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
            output: ijava-installer-darwin-arm64
          
          # Windows
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            platform: windows-amd64
            output: ijava-installer-windows-amd64.exe          
          - os: ubuntu-latest
            goos: windows
            goarch: arm64
            platform: windows-arm64
            output: ijava-installer-windows-arm64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.output }} ./cmd/installer
          
          # Vérifier que le binaire existe
          ls -lh ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 90

  summary:
    name: Build Summary
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display summary
        run: |
          echo "## 📦 Binaires compilés" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Plateforme | Taille | Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          
          for file in ./artifacts/*/ijava-installer-*; do
            if [ -f "$file" ]; then
              name=$(basename "$file")
              size=$(ls -lh "$file" | awk '{print $5}')
              platform=$(echo "$name" | sed 's/ijava-installer-//' | sed 's/\.exe$//')
              echo "| $platform | $size | ✓ |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pour créer une release:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "gh release create installer-v2.0.0 \\" >> $GITHUB_STEP_SUMMARY
          echo "  --title 'iJava Enhanced Installer v2.0.0' \\" >> $GITHUB_STEP_SUMMARY
          echo "  --notes 'Installeur avec animation Harmonica + Lipgloss' \\" >> $GITHUB_STEP_SUMMARY
          echo "  $(find ./artifacts -name 'ijava-installer-*' -type f)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
